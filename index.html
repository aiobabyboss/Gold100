<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ရွှေမျက်နှာ ၁၀၀</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --gold: #D4AF37; --black: #050505; --card-w: 75px; --card-h: 115px; }
        body { margin: 0; background: var(--black); color: white; font-family: sans-serif; overflow-x: hidden; height: 100vh; background-image: radial-gradient(circle, #2a0202 0%, #000 100%); user-select: none; -webkit-user-select: none; }
        
        /* Sidebar */
        #sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: rgba(10, 0, 0, 0.98); border-right: 1px solid var(--gold); z-index: 3000; transition: 0.4s; padding: 20px; box-sizing: border-box; }
        #sidebar.open { left: 0; }
        .sidebar-btn { width: 100%; background: none; border: 1px solid transparent; color: #ddd; padding: 15px; text-align: left; cursor: pointer; font-size: 1rem; border-bottom: 0.5px solid #222; }
        
        /* Navigation */
        #nav-bar { position: fixed; top: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.8); display: none; align-items: center; padding: 0 15px; z-index: 1500; border-bottom: 1px solid var(--gold); }
        
        /* Table/Grid Area */
        #table { position: relative; width: 100vw; height: calc(100vh - 60px); display: none; margin-top: 60px; overflow-y: auto; padding-bottom: 50px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding: 15px; }

        /* Card Styles */
        .card { width: var(--card-w); height: var(--card-h); position: absolute; perspective: 1000px; transition: 1.2s; }
        .grid-card { position: relative !important; top: auto !important; left: auto !important; margin: 0 auto; width: 80px; height: 120px; }
        
        .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: 0.6s; cursor: pointer; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 6px; border: 1.5px solid var(--gold); }
        .back { background: #1a1a1a; background-image: url('1.png'); background-size: cover; }
        .front { transform: rotateY(180deg); background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .front img { width: 100%; height: 100%; object-fit: contain; }

        /* Zoom Modal */
        #zoom-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; justify-content: center; align-items: center; flex-direction: column; }
        #zoom-img { width: 85%; max-width: 380px; border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 0 20px var(--gold); }
        
        .btn { background: linear-gradient(135deg, #5a0505, #2a0202); border: 1px solid var(--gold); color: var(--gold); padding: 15px; border-radius: 5px; cursor: pointer; font-size: 1rem; width: 100%; }
        .pass-input { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 12px; text-align: center; width: 220px; margin-bottom: 25px; font-size: 1.3rem; outline: none; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2900; display: none; }
    </style>
</head>
<body>

    <div id="zoom-modal" onclick="closeZoom()">
        <img id="zoom-img" src="">
        <div style="margin-top:20px; color:var(--gold); border:1px solid var(--gold); padding:10px 25px; border-radius:30px; background:rgba(0,0,0,0.5)">ပိတ်မည်</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <div id="sidebar">
        <div style="color:var(--gold); font-weight:bold; margin-bottom:20px; text-align:center; border-bottom:1px solid var(--gold); padding-bottom:10px;">MENU</div>
        <button class="sidebar-btn" onclick="showGallery()">🎴 ကတ်များကြည့်ရန်</button>
        <button class="sidebar-btn" onclick="selectSpread('single', 1)">✨ ရွှေတစ်ချပ်အခင်း</button>
        <button class="sidebar-btn" onclick="selectSpread('kadaw', 4)">🙏 ကတော်လေးပါး</button>
        <button class="sidebar-btn" onclick="selectSpread('kuni', 5)">🎪 ကူနီပွဲ</button>
        <button class="sidebar-btn" onclick="selectSpread('saloon', 6)">⛰️ စလွန်းတောင်</button>
        <button class="sidebar-btn" onclick="selectSpread('house', 7)">🏠 အိမ်တွင်း ၇ ပါး</button>
        <button class="sidebar-btn" onclick="selectSpread('zodiac', 12)">♈ (၁၂) ရာသီခွင်</button>
    </div>

    <div id="nav-bar">
        <div onclick="toggleMenu()" style="font-size:24px; color:var(--gold); cursor:pointer;">☰</div>
        <div style="flex-grow:1; text-align:center; color:var(--gold); font-weight:bold;">ရွှေမျက်နှာ ၁၀၀</div>
    </div>

    <div id="gate" style="position:fixed; inset:0; background:black; z-index:4000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h2 style="color:var(--gold);">ရွှေမျက်နှာ ၁၀၀</h2>
        <input type="password" id="pass" class="pass-input" placeholder="••••••" maxlength="6">
        <button class="btn" style="width:245px" onclick="auth()">ACCESS</button>
    </div>

    <div id="menu-screen" style="position:fixed; inset:0; background:black; z-index:2500; display:none; flex-direction:column; justify-content:center; align-items:center;">
        <h2 style="color:var(--gold); margin-bottom:30px;">နိမိတ်အခင်းအကျင်း</h2>
        <div style="display:flex; flex-direction:column; gap:12px; width:260px">
            <button class="btn" onclick="showGallery()" style="border-width:2px; margin-bottom:10px;">🎴 ကတ်များကြည့်ရန်</button>
            <button class="btn" onclick="selectSpread('single', 1)">ရွှေတစ်ချပ်အခင်း</button>
            <button class="btn" onclick="selectSpread('kadaw', 4)">ကတော်လေးပါး</button>
            <button class="btn" onclick="selectSpread('kuni', 5)">ကူနီပွဲ</button>
            <button class="btn" onclick="selectSpread('saloon', 6)">စလွန်းတောင်</button>
            <button class="btn" onclick="selectSpread('house', 7)">အိမ်တွင်း ၇ ပါး</button>
            <button class="btn" onclick="selectSpread('zodiac', 12)">(၁၂) ရာသီခွင်အခင်း</button>
        </div>
    </div>

    <div id="table"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }

        const table = document.getElementById('table');
        const menuScreen = document.getElementById('menu-screen');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const navBar = document.getElementById('nav-bar');

        const layouts = {
            single: [{t:45, l:50}],
            saloon: [{t:10,l:50},{t:35,l:25},{t:35,l:75},{t:65,l:15},{t:65,l:50},{t:65,l:85}],
            kadaw:  [{t:15,l:50},{t:48,l:20},{t:48,l:80},{t:80,l:50}],
            kuni:   [{t:15,l:25},{t:15,l:75},{t:48,l:50},{t:80,l:25},{t:80,l:75}],
            house:  [{t:10,l:30},{t:10,l:70},{t:42,l:15},{t:42,l:50},{t:42,l:85},{t:75,l:30},{t:75,l:70}],
            zodiac: []
        };
        for (let i = 0; i < 12; i++) {
            let angle = (i * 30) - 90;
            layouts.zodiac.push({t: 48 + 38 * Math.sin(angle * Math.PI / 180), l: 50 + 38 * Math.cos(angle * Math.PI / 180)});
        }

        function auth() {
            if(document.getElementById('pass').value === "111111") {
                document.getElementById('gate').style.display = 'none';
                menuScreen.style.display = 'flex';
            } else { alert('ဆုတောင်း'); }
        }

        function toggleMenu() {
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function showGallery() {
            menuScreen.style.display = 'none';
            navBar.style.display = 'flex';
            table.style.display = 'block';
            sidebar.classList.remove('open');
            overlay.style.display = 'none';
            
            table.innerHTML = '<div class="grid-container" id="grid"></div>';
            const grid = document.getElementById('grid');
            
            for(let i=1; i<=100; i++) {
                const div = document.createElement('div');
                div.className = 'card grid-card flipped';
                div.innerHTML = `
                    <div class="card-inner" onclick="openZoom(${i})">
                        <div class="face front">
                            <img src="${i}.png" onerror="this.onerror=null; this.src='${i}.PNG';">
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            }
            table.scrollTop = 0;
        }

        function selectSpread(type, count) {
            menuScreen.style.display = 'none'; navBar.style.display = 'flex'; table.style.display = 'block'; sidebar.classList.remove('open'); overlay.style.display = 'none';
            draw(type, count);
        }

        function draw(type, count) {
            table.innerHTML = '';
            table.style.overflowY = 'hidden';
            const cardSize = type === 'zodiac' ? '60px' : '80px';
            const cardHeight = type === 'zodiac' ? '95px' : '125px';
            document.documentElement.style.setProperty('--card-w', cardSize);
            document.documentElement.style.setProperty('--card-h', cardHeight);

            let pool = Array.from({length: 100}, (_, i) => i + 1);
            let selected = [];
            for(let i=0; i<count; i++) {
                let idx = Math.floor(Math.random() * pool.length);
                selected.push(pool.splice(idx, 1)[0]);
            }

            selected.forEach((num, i) => {
                const c = document.createElement('div');
                c.className = 'card';
                c.style.top = '50%'; c.style.left = '50%';
                c.innerHTML = `<div class="card-inner" onclick="handleCardClick(this, ${num})"><div class="face back"></div><div class="face front"><img src="${num}.png" onerror="this.onerror=null; this.src='${num}.PNG';"></div></div>`;
                table.appendChild(c);
                setTimeout(() => { c.style.top = layouts[type][i].t + '%'; c.style.left = `calc(${layouts[type][i].l}% - (var(--card-w) / 2))`; }, i * 100);
            });
        }

        function handleCardClick(inner, num) {
            const card = inner.parentElement;
            if(!card.classList.contains('flipped')) card.classList.add('flipped');
            else openZoom(num);
        }

        function openZoom(num) {
            const img = document.getElementById('zoom-img');
            img.src = `${num}.png`;
            img.onerror = () => img.src = `${num}.PNG`;
            document.getElementById('zoom-modal').style.display = 'flex';
        }

        function closeZoom() { document.getElementById('zoom-modal').style.display = 'none'; }
    </script>
</body>
</html>
