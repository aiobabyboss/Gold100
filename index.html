<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ရွှေမျက်နှာ ၁၀၀ - နိမိတ်ပုံများ</title>
    <style>
        :root {
            --royal-gold: #D4AF37;
            --deep-maroon: #4A0404;
            --black: #0A0A0A;
            --card-w: 85px;
            --card-h: 135px;
        }

        body {
            margin: 0; background: var(--black); color: white;
            font-family: 'Segoe UI', serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle, #2a0202 0%, #000 100%);
        }

        /* Access Gate */
        #gate {
            position: fixed; inset: 0; background: var(--black); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 5px double var(--royal-gold);
        }

        /* Full Screen Menu Screen */
        #menu-screen {
            position: fixed; inset: 0; background: rgba(10, 0, 0, 0.98); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-title {
            color: var(--royal-gold); font-size: 1.8rem; margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); font-weight: bold;
        }

        .spread-options { display: flex; flex-direction: column; gap: 15px; width: 280px; }

        .menu-btn {
            background: linear-gradient(135deg, #5a0505, #2a0202); 
            border: 1px solid var(--royal-gold); color: var(--royal-gold);
            padding: 18px; font-size: 1.1rem; border-radius: 4px; cursor: pointer;
            transition: 0.3s; text-align: center;
        }

        .menu-btn:hover { background: var(--royal-gold); color: var(--deep-maroon); font-weight: bold; }

        /* Board Area */
        #table { position: relative; width: 100vw; height: 90vh; max-width: 800px; margin-top: 20px; display: none; }

        .back-btn {
            position: absolute; top: 10px; right: 20px; background: none;
            border: 1px solid var(--royal-gold); color: var(--royal-gold); 
            padding: 8px 15px; border-radius: 4px; cursor: pointer; z-index: 50;
        }

        /* 3D Card */
        .card {
            width: var(--card-w); height: var(--card-h); position: absolute;
            perspective: 1000px; transition: all 1s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .card-inner {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d; transition: transform 0.8s ease; cursor: pointer;
        }

        .card.flipped .card-inner { transform: rotateY(180deg); }

        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 6px; 
            border: 2px solid var(--royal-gold); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Card Back with your specific image */
        .back { 
            background: #1a1a1a;
            background-image: url('https://i.ibb.co/rfsHXz2W/file-0000000050c0720994b917cac9b85031.png');
            background-size: cover;
            background-position: center;
        }

        .front { transform: rotateY(180deg); background: white; display: flex; align-items: center; justify-content: center; }
        .front img { width: 95%; height: 95%; object-fit: contain; }

        .pass-input {
            background: none; border: 1px solid var(--royal-gold); color: var(--royal-gold);
            padding: 12px; text-align: center; font-size: 1.2rem; width: 220px; margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div id="gate">
        <h2 style="color:var(--royal-gold);">ရွှေမျက်နှာ ၁၀၀</h2>
        <input type="password" id="pass" class="pass-input" placeholder="လျှို့ဝှက်နံပါတ်" maxlength="6">
        <button class="menu-btn" style="width:245px" onclick="auth()">ဝင်မည်</button>
    </div>

    <div id="menu-screen" style="display:none">
        <div class="menu-title">နိမိတ်အခင်းအကျင်း ရွေးချယ်ပါ</div>
        <div class="spread-options">
            <button class="menu-btn" onclick="selectSpread('saloon', 6)">စလွန်းတောင် အခင်း</button>
            <button class="menu-btn" onclick="selectSpread('kadaw', 4)">ကတော်လေးပါး အခင်း</button>
            <button class="menu-btn" onclick="selectSpread('kuni', 5)">ကူနီပွဲ အခင်း</button>
            <button class="menu-btn" onclick="selectSpread('house', 7)">အိမ်တွင်း ၇ ပါး အခင်း</button>
        </div>
    </div>

    <div id="table">
        <button class="back-btn" onclick="resetToMenu()">← ပြန်ထွက်မည်</button>
    </div>

    <script>
        const gate = document.getElementById('gate');
        const menuScreen = document.getElementById('menu-screen');
        const table = document.getElementById('table');

        const layouts = {
            saloon: [{t:10,l:45},{t:35,l:25},{t:35,l:65},{t:70,l:15},{t:70,l:45},{t:70,l:75}],
            kadaw:  [{t:15,l:45},{t:45,l:20},{t:45,l:70},{t:75,l:45}],
            kuni:   [{t:15,l:25},{t:15,l:65},{t:45,l:45},{t:75,l:25},{t:75,l:65}],
            house:  [{t:10,l:25},{t:10,l:65},{t:40,l:10},{t:40,l:45},{t:40,l:80},{t:75,l:25},{t:75,l:65}]
        };

        function auth() {
            if(document.getElementById('pass').value === "999999") {
                gate.style.display = 'none';
                menuScreen.style.display = 'flex';
            } else { alert('!'); }
        }

        function selectSpread(type, count) {
            menuScreen.style.opacity = '0';
            setTimeout(() => {
                menuScreen.style.display = 'none';
                table.style.display = 'block';
                draw(type, count);
            }, 500);
        }

        function draw(type, count) {
            const coords = layouts[type];
            table.querySelectorAll('.card').forEach(c => c.remove());

            for(let i=0; i<count; i++) {
                const c = document.createElement('div');
                c.className = 'card';
                c.style.top = '110%'; c.style.left = '45%';
                
                const randomID = Math.floor(Math.random() * 100) + 1;
                c.innerHTML = `
                    <div class="card-inner" onclick="this.parentElement.classList.toggle('flipped')">
                        <div class="face back"></div>
                        <div class="face front">
                            <img src="https://picsum.photos/seed/${randomID}/150/230" alt="Result">
                        </div>
                    </div>
                `;
                table.appendChild(c);

                setTimeout(() => {
                    c.style.top = coords[i].t + '%';
                    c.style.left = `calc(${coords[i].l}% - 42px)`;
                }, i * 200);
            }
        }

        function resetToMenu() {
            table.style.display = 'none';
            menuScreen.style.display = 'flex';
            menuScreen.style.opacity = '1';
        }
    </script>
</body>
</html>
